name: Visual regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  visual-regression:
    # Het template test zijn eigen reusable workflow in template-regression.yml.
    # Documentrepositories blijven de centrale workflow en hetzelfde beleid gebruiken.
    if: ${{ github.repository != 'Geonovum/NL-ReSpec-template' }}
    uses: Geonovum/NL-ReSpec-template/.github/workflows/visual-regression-reusable.yml@v1
    with:
      fail_on_difference: false
